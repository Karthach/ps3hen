<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="cache-control" content="no-cache, must-revalidate, post-check=0, pre-check=0">
    <meta http-equiv="cache-control" content="max-age=0">
    <meta http-equiv="expires" content="0">
    <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT">
    <meta http-equiv="pragma" content="no-cache">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS3HEN Dashboard</title>
    <link rel="stylesheet" href="hen/style.css">
</head>
<body>
    <div class="container">
        <h1>PS3HEN Dashboard</h1>
        <p>Bienvenido al instalador avanzado de PS3HEN.</p>
        
        <div class="info-box">
            <div class="info-item">
                <span class="label">Firmware Detectado:</span><br>
                <span id="fw-version" class="value">Detectando...</span>
            </div>
            <div class="info-item">
                <span class="label">Navegador:</span><br>
                <span id="ua-string" class="value">...</span>
            </div>
            <div class="info-item">
                <span class="label">Resolución:</span><br>
                <span id="screen-res" class="value">...</span>
            </div>
        </div>

        <div id="action-area">
            <p>Comprobando compatibilidad...</p>
        </div>
    </div>

    <script>
        var ua = navigator.userAgent;
        var fwVersion = "Desconocido";
        
        if (ua.indexOf("5.0 (") > -1) {
            fwVersion = ua.substring(ua.indexOf("5.0 (") + 19, ua.indexOf(") Apple"));
        }

        document.getElementById('fw-version').innerText = fwVersion;
        document.getElementById('ua-string').innerText = ua;
        document.getElementById('screen-res').innerText = window.screen.width + "x" + window.screen.height;

        var supportedVersions = ["4.88", "4.89", "4.90", "4.91", "4.92", "4.93"];
        var actionArea = document.getElementById('action-area');

        if (supportedVersions.indexOf(fwVersion) > -1) {
            actionArea.innerHTML = '<a href="./' + fwVersion + '/index.html" class="btn">Instalar HEN ' + fwVersion + '</a>';
        } else {
            actionArea.innerHTML = '<p class="unsupported">Versión ' + fwVersion + ' no soportada directamente.<br>Por favor, asegúrate de estar en un Firmware Híbrido (HFW).</p>';
        }
    </script>
</body>
</html>
